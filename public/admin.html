<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin · THE ALPHA GAMER</title>
<style>
:root{--bg:#070d1c;--card:#0f1a33;--line:#1d2b4d;--tx:#eef2ff;--mu:#8e9bbd;--or:#ff7a1a;--am:#ffc233;--gr:#2ecc71;--rd:#ef4444;--bl:#3b82f6;color-scheme:dark}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:0 12px 80px;max-width:980px;margin:auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 6px}h1{font-size:19px;margin-bottom:8px}h1 i{color:var(--or);font-style:normal}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.tabs button{white-space:nowrap;padding:8px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--mu);cursor:pointer;font-weight:600}.tabs button.on{background:var(--or);color:#1a0d00;border-color:var(--or)}
h2{font-size:16px;margin:14px 0 8px;color:var(--am)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
input,select,textarea{width:100%;background:#0a1330;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:9px;margin:3px 0;font:inherit}input[type=checkbox]{width:auto}
label,.mu{color:var(--mu);font-size:13px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
button.b{background:var(--or);color:#1a0d00;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;margin:3px 3px 0 0}button.g{background:var(--gr)}button.r{background:var(--rd);color:#fff}button.x{background:#26345a;color:var(--tx)}button.sm{padding:5px 10px;font-size:13px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.tile b{display:block;font-size:24px;color:var(--am)}.tile span{color:var(--mu);font-size:13px}
.st{padding:2px 9px;border-radius:10px;font-size:12px;font-weight:700;background:#26345a}.st.approved,.st.completed{background:#0c3a22;color:var(--gr)}.st.pending,.st.approved.w{background:#4a3b0a;color:var(--am)}.st.rejected{background:#4a1414;color:var(--rd)}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}.big{font-size:18px;font-weight:700}.on{color:var(--gr)}
#toast{position:fixed;bottom:14px;left:12px;right:12px;max-width:600px;margin:auto;background:#12306b;border:1px solid var(--am);padding:10px;border-radius:8px;display:none;z-index:9}
img.pv{height:64px;border-radius:8px;display:block;margin:6px 0;background:#fff}details{margin:8px 0}summary{cursor:pointer;color:var(--am);padding:6px 0}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
</style></head><body>
<header><h1>THE <i>ALPHA</i> GAMER · Admin</h1><div id="nav"></div></header><div id="root"></div><div id="toast"></div>
<script>
var $=function(i){return document.getElementById(i)},CFG={categories:[]},tab='dash',SUB={dep:'pending',wd:'open'},SUM={};
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function api(m,p,b){return fetch(p,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().then(function(j){j.status=r.status;return j})}).catch(function(){return{error:'Network problem',status:0}})}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},3500)}
function fd(x){var d=typeof x==='number'?new Date(x):new Date(String(x).replace(' ','T')+'Z');return d.toLocaleString('en-IN',{day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'})}
function act(m,p,b,after){api(m,p,b||{}).then(function(r){if(r.error)toast(r.error);else{if(after)after(r);else toast('Done')}})}
function each(sel,root,fn){[].forEach.call((root||document).querySelectorAll(sel),fn)}
function up(file,cb){if(!file)return;if(file.size>20*1024*1024)return toast('Max 20 MB per image');toast('Uploading '+Math.round(file.size/1024)+' KB…');
fetch('/api/admin/upload',{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream'},body:file}).then(function(r){return r.json()}).then(function(j){j.url?cb(j.url):toast(j.error||'Upload failed')}).catch(function(){toast('Upload failed')})}
function sub(v,key,opts,render){v.innerHTML='<div class="tabs">'+opts.map(function(o){return'<button data-sb="'+o[0]+'" class="'+(SUB[key]===o[0]?'on':'')+'">'+o[1]+'</button>'}).join('')+'</div><div id="sb"></div>';
each('[data-sb]',v,function(b){b.onclick=function(){SUB[key]=b.dataset.sb;sub(v,key,opts,render)}});render($('sb'),SUB[key])}
/* ---------- login ---------- */
function login(){$('nav').innerHTML='';$('root').innerHTML='<div class="card" style="max-width:380px;margin-top:20px"><b>Admin login</b><input id="e" type="email" placeholder="Admin Gmail" autocomplete="email"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button class="b" id="go">Login</button></div>';
$('go').onclick=function(){api('POST','/api/admin/login',{email:$('e').value,password:$('p').value}).then(function(r){if(r.user)boot();else toast(r.error)})};$('p').onkeydown=function(e){if(e.key==='Enter')$('go').click()}}
function boot(){api('GET','/api/config').then(function(c){CFG=c;return api('GET','/api/admin/summary')}).then(function(s){if(s.status===401||s.status===403)return login();SUM=s;frame()})}
function frame(){var s=SUM,T=[['dash','🏠 Home'],['dep','💰 Deposits'+(s.pendingDeposits?' ('+s.pendingDeposits+')':'')],['wd','🏧 Withdrawals'+(s.pendingWithdrawals?' ('+s.pendingWithdrawals+')':'')],['t','🎮 Matches'],['ev','🖼 Events'],['u','👥 Users'],['al','🔔 Alerts'],['set','⚙️ Settings'],['log','📜 Logs']];
$('nav').innerHTML='<div class="tabs">'+T.map(function(t){return'<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'<button class="x b" id="lo">Logout</button></div>';
each('[data-t]',$('nav'),function(b){b.onclick=function(){tab=b.dataset.t;api('GET','/api/admin/summary').then(function(x){SUM=x;frame()})}});$('lo').onclick=function(){api('POST','/api/logout').then(login)};
({dash:pDash,dep:pDep,wd:pWd,t:pT,ev:pEv,u:pU,al:pAl,set:pSet,log:pLog})[tab]($('root'))}
/* ---------- dashboard ---------- */
function pDash(v){var s=SUM,t=function(n,l,c){return'<div class="tile"><b'+(c?' class="on"':'')+'>'+n+'</b><span>'+l+'</span></div>'};
v.innerHTML='<h2>Today</h2><div class="g4">'+t(s.users,'Total players')+t(s.online,'Online now (5 min)',1)+t(s.newToday,'New players (24h)')+t(s.upcoming,'Upcoming matches')+t('₹'+s.depositsToday,'Deposits (24h)')+t('₹'+s.withdrawnToday,'Paid out (24h)')+t(s.pendingDeposits,'Deposits to approve')+t(s.pendingWithdrawals,'Withdrawals open')+'</div>'+
'<h2>Quick actions</h2><button class="b" data-g="dep">Approve deposits</button><button class="b" data-g="wd">Withdrawals</button><button class="b g" data-g="t">+ Create match</button><button class="b x" data-g="ev">Events slider</button><button class="b x" data-g="u">Add money by mobile</button>';
each('[data-g]',v,function(b){b.onclick=function(){tab=b.dataset.g;frame()}})}
/* ---------- deposits ---------- */
function rowHist(r,k){var who='<div>👤 <b>'+esc(r.gamer_name)+'</b> · UID '+esc(r.ff_uid)+' · 📱 '+esc(r.mobile||'—')+'</div><div class="mu">'+esc(r.email)+'</div>';
return k==='dep'?'<div class="card"><div class="row"><span class="big">₹'+r.amount+(r.src==='admin'?' <span class="st">admin credit</span>':'')+'</span><span><span class="st '+r.status+'">'+r.status+'</span> <span class="mu">'+fd(r.created_at)+'</span></span></div>'+who+'<div class="mu">'+(r.src==='admin'?esc(r.utr):'UTR '+esc(r.utr))+'</div></div>':
'<div class="card"><div class="row"><span class="big">₹'+r.amount+'</span><span><span class="st '+r.status+'">'+r.status+'</span> <span class="mu">'+fd(r.created_at)+'</span></span></div>'+who+'<div>UPI: <b>'+esc(r.upi)+'</b>'+(r.payout_ref?' · paid ref '+esc(r.payout_ref):'')+'</div></div>'}
function history(el,k){var path=k==='dep'?'deposits':'withdrawals';el.innerHTML='<div class="card"><div class="g4"><select id="hd"><option value="1">Last 24 hours</option><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="0">All time</option></select><select id="hs"><option value="all">All status</option>'+(k==='dep'?'<option>approved</option><option>pending</option><option>rejected</option>':'<option>pending</option><option>approved</option><option>completed</option><option>rejected</option>')+'</select><input id="hq" placeholder="Search name, Gmail, mobile, UTR/UPI"><button class="b" id="hg">Show</button></div></div><div id="hr"></div>';
var go=function(){api('GET','/api/admin/history/'+path+'?days='+$('hd').value+'&status='+$('hs').value+'&q='+encodeURIComponent($('hq').value)).then(function(r){$('hr').innerHTML='<div class="card row"><span>'+r.count+' entries</span><b class="'+(k==='dep'?'on':'')+'">'+(k==='dep'?'Approved total: ':'Paid out total: ')+'₹'+r.total+'</b></div>'+(r.rows.length?r.rows.map(function(x){return rowHist(x,k)}).join(''):'<p class="mu">No records.</p>')})};
$('hg').onclick=go;$('hq').onkeydown=function(e){if(e.key==='Enter')go()};$('hd').onchange=go;$('hs').onchange=go;go()}
function pDep(v){sub(v,'dep',[['pending','⏳ Pending approval'],['hist','📒 Deposit history']],function(el,k){if(k==='hist')return history(el,'dep');
api('GET','/api/admin/deposits?status=pending').then(function(r){el.innerHTML='<p class="mu">Check the payment in your Jio/bank app (amount + UTR) BEFORE approving. Approve adds coins once.</p>'+((r.rows||[]).length?r.rows.map(function(d){return'<div class="card"><div class="row"><span class="big">₹'+d.amount+'</span><span class="mu">'+fd(d.created_at)+'</span></div><div>👤 <b>'+esc(d.gamer_name)+'</b> <span class="mu">'+esc(d.email)+'</span></div><div>UTR: <b>'+esc(d.utr)+'</b></div><button class="b g" data-a="'+d.id+'">Approve</button><button class="b r" data-r="'+d.id+'">Reject</button></div>'}).join(''):'<div class="card mu">No pending deposits 🎉</div>');
each('[data-a]',el,function(b){b.onclick=function(){if(confirm('Payment received in your account? Approve and add coins?'))act('POST','/api/admin/deposits/'+b.dataset.a+'/approve',{},function(){toast('Approved');boot()})}});
each('[data-r]',el,function(b){b.onclick=function(){if(confirm('Reject this deposit?'))act('POST','/api/admin/deposits/'+b.dataset.r+'/reject',{},function(){toast('Rejected');boot()})}})})})}
/* ---------- withdrawals ---------- */
function pWd(v){sub(v,'wd',[['open','⏳ Open requests'],['hist','📒 Withdrawal history']],function(el,k){if(k==='hist')return history(el,'wd');
api('GET','/api/admin/withdrawals').then(function(r){el.innerHTML='<p class="mu">Pay the UPI ID yourself, then press Mark paid and enter your payout UTR. Reject refunds the coins to the player.</p>'+((r.rows||[]).length?r.rows.map(function(w){return'<div class="card"><div class="row"><span class="big">₹'+w.amount+' → '+esc(w.upi)+'</span><span class="st '+(w.status==='approved'?'pending':w.status)+'">'+w.status+'</span></div><div>👤 <b>'+esc(w.gamer_name)+'</b> <span class="mu">'+esc(w.email)+' · '+fd(w.created_at)+'</span></div>'+(w.status==='pending'?'<button class="b x" data-ap="'+w.id+'">Approve</button>':'')+'<button class="b g" data-c="'+w.id+'">Mark paid</button><button class="b r" data-r="'+w.id+'">Reject</button></div>'}).join(''):'<div class="card mu">No open withdrawals.</div>');
each('[data-ap]',el,function(b){b.onclick=function(){act('POST','/api/admin/withdrawals/'+b.dataset.ap+'/approve',{},function(){boot()})}});
each('[data-c]',el,function(b){b.onclick=function(){var ref=prompt('Your payout UTR / reference');if(ref)act('POST','/api/admin/withdrawals/'+b.dataset.c+'/complete',{ref:ref},function(){toast('Marked paid');boot()})}});
each('[data-r]',el,function(b){b.onclick=function(){if(confirm('Reject and refund coins to the player?'))act('POST','/api/admin/withdrawals/'+b.dataset.r+'/reject',{},function(){toast('Rejected & refunded');boot()})}})})})}
/* ---------- users + add money by mobile ---------- */
function pU(v){v.innerHTML='<div class="card"><b>➕ Add money by mobile number</b><div class="g2"><input id="cm" placeholder="Player mobile (10 digits)" inputmode="numeric"><input id="ca" type="number" placeholder="Amount (coins)"></div><input id="cn" placeholder="Note (optional)"><button class="b" id="cf">Find player</button><div id="cr"></div></div><h2>Players</h2><input id="q" placeholder="Search Gmail, gamer name, UID or mobile"><div id="ul"></div>';
$('cf').onclick=function(){var m=$('cm').value.replace(/\D/g,'').slice(-10),a=+$('ca').value;if(m.length!==10)return toast('Enter the 10-digit mobile number');if(!(a>=1))return toast('Enter an amount');
api('GET','/api/admin/users?q='+m).then(function(r){var u=(r.rows||[]).filter(function(x){return x.mobile===m})[0];if(!u){$('cr').innerHTML='';return toast('No player found with this mobile number')}
$('cr').innerHTML='<div class="card" style="border-color:var(--gr)">Player: <b>'+esc(u.gamer_name)+'</b> · UID '+esc(u.ff_uid)+' · 📱 '+esc(u.mobile)+'<div class="mu">'+esc(u.email)+' · balance: deposit '+u.deposit_bal+', winning '+u.win_bal+'</div><button class="b g" id="cc">Confirm: add ₹'+a+'</button></div>';
$('cc').onclick=function(){$('cc').disabled=true;act('POST','/api/admin/credit',{mobile:m,amount:a,note:$('cn').value},function(x){toast('Added ₹'+a+' to '+x.gamerName+'. New deposit balance '+x.balance);$('cr').innerHTML='';$('cm').value='';$('ca').value='';load()})}})};
var load=function(){api('GET','/api/admin/users?q='+encodeURIComponent($('q').value)).then(function(r){$('ul').innerHTML=(r.rows||[]).map(function(u){var on=u.last_seen>Date.now()-300000;return'<div class="card"><div class="row"><span><b>'+esc(u.gamer_name)+'</b> '+(on?'<span class="on">● online</span>':'')+(u.role==='admin'?' <span class="st">admin</span>':'')+(u.blocked?' <span class="st rejected">blocked</span>':'')+'</span><span class="mu">joined '+fd(u.created_at)+'</span></div><div>UID <b>'+esc(u.ff_uid)+'</b> · 📱 <b>'+esc(u.mobile||'—')+'</b></div><div class="mu">'+esc(u.email)+'</div><div>Deposit '+u.deposit_bal+' · Winning '+u.win_bal+'</div>'+(u.role==='admin'?'':'<button class="b sm '+(u.blocked?'g':'r')+'" data-b="'+u.id+'" data-v="'+(u.blocked?0:1)+'">'+(u.blocked?'Unblock':'Block')+'</button>')+'<button class="b x sm" data-l="'+u.id+'">Transactions</button><div id="lg'+u.id+'"></div></div>'}).join('')||'<p class="mu">No players.</p>';
each('[data-b]',$('ul'),function(b){b.onclick=function(){act('POST','/api/admin/users/'+b.dataset.b+'/block',{blocked:b.dataset.v==='1'},load)}});
each('[data-l]',$('ul'),function(b){b.onclick=function(){api('GET','/api/admin/users/'+b.dataset.l+'/ledger').then(function(r){$('lg'+b.dataset.l).innerHTML='<table>'+r.rows.map(function(t){return'<tr><td>'+fd(t.created_at)+'</td><td>'+(t.kind==='credit'?'+':'−')+t.amount+' '+t.wallet+'</td><td>'+esc(t.reason)+' '+esc(t.note||'')+'</td></tr>'}).join('')+'</table>'})}})})};
$('q').oninput=function(){clearTimeout(window._t);window._t=setTimeout(load,300)};load()}
/* ---------- matches (auto-filled) ---------- */
function dtl(ms){var d=new Date(ms-new Date().getTimezoneOffset()*60000);return d.toISOString().slice(0,16)}
function pT(v){v.innerHTML='<button class="b g" id="nw">+ Create match</button><div id="fm"></div><div id="tl"></div>';var rows=[];$('nw').onclick=function(){mform(null)};
function list(){api('GET','/api/admin/tournaments').then(function(r){rows=r.rows||[];$('tl').innerHTML='<h2>All matches</h2>'+(rows.map(function(t){return'<div class="card"><div class="row"><span><b>'+esc(t.title)+'</b> #'+t.id+'</span><span class="st '+(t.state==='completed'?'completed':'pending')+'">'+t.state+(t.status==='cancelled'?' · cancelled':'')+'</span></div><div class="mu">'+esc(t.category)+' · '+t.mode+' · '+esc(t.map)+' · '+fd(t.startsAt)+'</div><div>Entry '+t.entryFee+' · Pool '+t.prizePool+' · Slots <b>'+t.booked+'/'+t.totalSlots+'</b>'+(t.roomId?' · room ✓':'')+'</div>'+
(t.status==='upcoming'?'<button class="b x sm" data-e="'+t.id+'">Edit</button><button class="b x sm" data-rm="'+t.id+'">Room ID/Pass</button>':'')+'<button class="b x sm" data-dup="'+t.id+'">Duplicate</button><button class="b x sm" data-p="'+t.id+'">Players</button>'+(t.status==='upcoming'&&t.state==='ongoing'?'<button class="b g sm" data-rs="'+t.id+'">Publish results</button>':'')+(t.status==='upcoming'?'<button class="b r sm" data-cx="'+t.id+'">Cancel &amp; refund</button>':'')+(t.booked===0&&t.status==='upcoming'?'<button class="b r sm" data-d="'+t.id+'">Delete</button>':'')+'<div id="x'+t.id+'"></div></div>'}).join('')||'<p class="mu">No matches yet.</p>');bind()})}
var by=function(id){return rows.filter(function(t){return t.id==id})[0]};
function bind(){var T=$('tl');each('[data-e]',T,function(b){b.onclick=function(){mform(by(b.dataset.e))}});
each('[data-dup]',T,function(b){b.onclick=function(){var t=Object.assign({},by(b.dataset.dup));delete t.id;t.startsAt=Date.now()+3600e3;mform(t)}});
each('[data-d]',T,function(b){b.onclick=function(){if(confirm('Delete this match?'))act('DELETE','/api/admin/tournaments/'+b.dataset.d,null,list)}});
each('[data-cx]',T,function(b){b.onclick=function(){if(confirm('Cancel this match and refund every player?'))act('POST','/api/admin/tournaments/'+b.dataset.cx+'/cancel',{},function(){toast('Cancelled, refunds sent');list()})}});
each('[data-rm]',T,function(b){b.onclick=function(){var t=by(b.dataset.rm),id=prompt('Room ID',t.roomId||'');if(!id)return;var pw=prompt('Room password',t.roomPass||'');if(pw)act('POST','/api/admin/tournaments/'+t.id+'/room',{roomId:id,roomPass:pw},function(){toast('Saved. Joined players got an alert.');list()})}});
each('[data-p]',T,function(b){b.onclick=function(){api('GET','/api/admin/tournaments/'+b.dataset.p+'/players').then(function(p){$('x'+b.dataset.p).innerHTML=p.rows.length?'<table><tr><th>Pos</th><th>In-game name</th><th>UID</th><th>Mobile</th></tr>'+p.rows.map(function(x){return'<tr><td>'+x.slot+'</td><td>'+esc(x.player_name)+'</td><td>'+esc(x.player_uid)+'</td><td>'+esc(x.mobile||'')+'</td></tr>'}).join('')+'</table>':'<p class="mu">Nobody joined yet.</p>'})}});
each('[data-rs]',T,function(b){b.onclick=function(){var t=by(b.dataset.rs);api('GET','/api/admin/tournaments/'+t.id+'/players').then(function(p){$('x'+t.id).innerHTML='<p class="mu">Enter kills and rank prize per player (blank = 0). Per-kill ('+t.perKill+') is added automatically. Publish only once.</p><table><tr><th>Player</th><th>Kills</th><th>Rank prize</th></tr>'+p.rows.map(function(x){return'<tr><td>'+esc(x.player_name)+'<div class="mu">'+esc(x.player_uid)+'</div></td><td><input data-k="'+esc(x.player_uid)+'" type="number" min="0"></td><td><input data-z="'+esc(x.player_uid)+'" type="number" min="0"></td></tr>'}).join('')+'</table><button class="b g" id="pub'+t.id+'">Publish &amp; pay winners</button>';
$('pub'+t.id).onclick=function(){var rx=p.rows.map(function(x){return{uid:x.player_uid,kills:+(document.querySelector('[data-k="'+x.player_uid+'"]').value||0),rankPrize:+(document.querySelector('[data-z="'+x.player_uid+'"]').value||0)}});if(confirm('Publish results and credit winners? Cannot be undone.'))act('POST','/api/admin/tournaments/'+t.id+'/results',{rows:rx},function(r){toast('Paid '+r.paid+' coins');list()})}})}})}
function mform(t){var f=$('fm'),edit=t&&t.id,c0=(t&&t.category)||CFG.categories[0].id;t=t||{};var start=t.startsAt||Date.now()+3600e3;
f.innerHTML='<div class="card"><b>'+(edit?'Edit match #'+t.id:'Create match')+'</b><div class="g2"><div><label>Game</label><select id="fc">'+CFG.categories.map(function(c){return'<option value="'+c.id+'" '+(c.id===c0?'selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select></div><div><label>Entry fee per player (0 = free)</label><input id="fe" type="number" min="0" value="'+(t.entryFee!=null?t.entryFee:10)+'"></div></div>'+
'<div class="g2"><div><label>Total prize pool</label><input id="fp" type="number" min="0" value="'+(t.prizePool!=null?t.prizePool:100)+'"></div><div><label>Start time</label><input id="fs" type="datetime-local" value="'+dtl(start)+'"></div></div><div>'+[15,30,60,120].map(function(m){return'<button class="b x sm" data-q="'+m+'">+'+(m<60?m+' min':m/60+' hr')+'</button>'}).join('')+'</div><p class="mu" id="hint" style="margin:6px 0"></p>'+
'<details><summary>More options (already auto-filled — change only if needed)</summary><div class="g2"><div><label>Title</label><input id="ft" value="'+esc(t.title||'')+'"></div><div><label>Map</label><input id="fm2" value="'+esc(t.map||'')+'"></div><div><label>Mode</label><select id="fmo"><option>solo</option><option>duo</option><option>squad</option></select></div><div><label>Total player slots</label><input id="fsl" type="number" value="'+(t.totalSlots||'')+'"></div><div><label>Per kill prize</label><input id="fk" type="number" min="0" value="'+(t.perKill||0)+'"></div></div><label>Prize details (shown to players; auto if empty)</label><textarea id="fpt" rows="3">'+esc(t.prizeText||'')+'</textarea><label>Rules (auto if empty)</label><textarea id="fr" rows="3">'+esc(t.rules||'')+'</textarea><label>Match banner (optional — else game photo is used)</label><input type="file" id="bf" accept="image/*"><input id="bn" placeholder="…or image URL" value="'+esc(t.banner||'')+'"></details>'+
(edit?'':'<div class="g2"><div><label>How many matches?</label><input id="fn" type="number" min="1" max="30" value="1"></div><div><label>…every (minutes)</label><input id="fi" type="number" min="5" value="30"></div></div>')+'<button class="b g" id="sv">'+(edit?'Save changes':'Create')+'</button><button class="b x" id="cl">Close</button></div>';
if(t.mode)$('fmo').value=t.mode;
var preset=function(fill){var c=CFG.categories.filter(function(x){return x.id===$('fc').value})[0];$('hint').textContent='Auto: '+c.mode+' · '+c.slots+' slots · map '+c.map+' · title '+c.name.toUpperCase();if(fill){$('ft').value=c.name.toUpperCase();$('fm2').value=c.map;$('fmo').value=c.mode;$('fsl').value=c.slots}};preset(!edit&&!t.title);if(!t.title&&!edit)preset(true);
$('fc').onchange=function(){preset(true)};each('[data-q]',f,function(b){b.onclick=function(){$('fs').value=dtl(Date.now()+b.dataset.q*60000)}});
$('bf').onchange=function(){up(this.files[0],function(u){$('bn').value=u;toast('Image uploaded')})};$('cl').onclick=function(){f.innerHTML=''};
$('sv').onclick=function(){var base=new Date($('fs').value).getTime();if(!base)return toast('Pick the start time');var n=edit?1:Math.max(1,+$('fn').value||1),gap=edit?0:(+$('fi').value||30)*60000;
var mk=function(i){return{category:$('fc').value,entryFee:+$('fe').value,prizePool:+$('fp').value,startsAt:base+i*gap,title:$('ft').value,map:$('fm2').value,mode:$('fmo').value,totalSlots:+$('fsl').value,perKill:+$('fk').value,prizeText:$('fpt').value,rules:$('fr').value,banner:$('bn').value}};
var i=0,go=function(){if(i>=n){toast(edit?'Saved':n+' match(es) created');f.innerHTML='';return list()}api(edit?'PUT':'POST','/api/admin/tournaments'+(edit?'/'+t.id:''),mk(i)).then(function(r){if(r.error)return toast('Stopped: '+r.error);i++;go()})};go()}}
list()}
/* ---------- events slider ---------- */
function pEv(v){api('GET','/api/admin/settings').then(function(S){v.innerHTML='<p class="mu">Events appear as an auto-sliding poster on the player Home page. Tapping a poster opens its link (Telegram, Instagram, WhatsApp, YouTube…).</p><button class="b g" id="ne">+ Add event</button><div id="ef"></div><div id="el"></div>';$('ne').onclick=function(){eform(null,S)};
function list(){api('GET','/api/admin/events').then(function(r){$('el').innerHTML=(r.rows||[]).map(function(e){return'<div class="card"><div class="row"><span><b>'+esc(e.title)+'</b> <span class="mu">order '+e.sort_order+'</span></span><span class="st '+(e.active?'completed':'rejected')+'">'+(e.active?'showing':'hidden')+'</span></div>'+(e.image?'<img class="pv" src="'+esc(e.image)+'">':'')+'<div class="mu">'+esc(e.link||'no link (opens details)')+'</div><button class="b x sm" data-ee="'+e.id+'">Edit</button><button class="b r sm" data-ed="'+e.id+'">Delete</button></div>'}).join('')||'<p class="mu">No events yet.</p>';
each('[data-ee]',$('el'),function(b){b.onclick=function(){eform(r.rows.filter(function(x){return x.id==b.dataset.ee})[0],S)}});each('[data-ed]',$('el'),function(b){b.onclick=function(){if(confirm('Delete this event?'))act('DELETE','/api/admin/events/'+b.dataset.ed,null,list)}})})}
function eform(e,S){var f=$('ef');e=e||{title:'',link:'',description:'',image:'',sort_order:0,active:1};
f.innerHTML='<div class="card"><b>'+(e.id?'Edit event':'New event')+'</b><label>Quick fill</label><select id="et"><option value="">Choose…</option><option value="tg">Telegram channel</option><option value="ig">Instagram page</option><option value="wa">WhatsApp</option><option value="">Custom</option></select><label>Title</label><input id="ti" value="'+esc(e.title)+'"><label>Link (opens when player taps)</label><input id="li" placeholder="https://…" value="'+esc(e.link)+'"><label>Poster image (JPG/PNG/WEBP up to 20 MB, landscape works best)</label>'+(e.image?'<img class="pv" id="pv" src="'+esc(e.image)+'">':'<img class="pv" id="pv" style="display:none">')+'<input type="file" id="if" accept="image/*"><input type="hidden" id="im" value="'+esc(e.image)+'"><label>Details (shown if no link)</label><textarea id="de" rows="2">'+esc(e.description)+'</textarea><div class="g2"><div><label>Order (small first)</label><input id="so" type="number" value="'+e.sort_order+'"></div><div><label>Show on app</label><select id="ac"><option value="1">Yes</option><option value="0" '+(e.active?'':'selected')+'>Hidden</option></select></div></div><button class="b g" id="sv">Save</button><button class="b x" id="cl">Close</button></div>';
$('et').onchange=function(){var v=this.value;if(v==='tg'){$('ti').value='Join our Telegram';$('li').value=S.telegramUrl||''}if(v==='ig'){$('ti').value='Follow us on Instagram';$('li').value=S.instagramUrl||''}if(v==='wa'){$('ti').value='Join our WhatsApp';$('li').value='https://wa.me/'+(S.whatsapp||'').replace(/\D/g,'')}};
$('if').onchange=function(){up(this.files[0],function(u){$('im').value=u;$('pv').src=u;$('pv').style.display='block'})};$('cl').onclick=function(){f.innerHTML=''};
$('sv').onclick=function(){var b={title:$('ti').value,link:$('li').value,image:$('im').value,description:$('de').value,sortOrder:+$('so').value,active:$('ac').value==='1'};api(e.id?'PUT':'POST','/api/admin/events'+(e.id?'/'+e.id:''),b).then(function(r){if(r.error)return toast(r.error);toast('Saved');f.innerHTML='';list()})}}
list()})}
/* ---------- alerts ---------- */
function pAl(v){api('GET','/api/admin/settings').then(function(S){v.innerHTML='<div class="card"><b>📢 Announcement (scrolling line on Home + popup)</b><textarea id="no" rows="2" maxlength="300">'+esc(S.notice)+'</textarea><button class="b" id="sn">Save announcement</button></div><div class="card"><b>🔔 Send notification to all players</b><p class="mu">Everyone sees it in Notifications. Players with Important Notice ON also get a popup + sound.</p><input id="nt" placeholder="Title" maxlength="80"><textarea id="nb" rows="2" placeholder="Message" maxlength="500"></textarea><button class="b g" id="ns">Send to all</button></div><p class="mu">Room ID/password alerts go automatically to joined players only when you save the room in Matches.</p>';
$('sn').onclick=function(){act('PUT','/api/admin/settings',{notice:$('no').value},function(){toast('Saved')})};$('ns').onclick=function(){act('POST','/api/admin/notify',{title:$('nt').value,body:$('nb').value},function(){toast('Sent');$('nt').value='';$('nb').value=''})}})}
/* ---------- settings ---------- */
function pSet(v){Promise.all([api('GET','/api/admin/settings'),api('GET','/api/admin/pages')]).then(function(z){var s=z[0],pg=z[1],ci=s.catImages||{};
v.innerHTML='<div class="card"><b>💳 Payment — change anytime</b><input id="su" placeholder="UPI ID, e.g. name@jio" value="'+esc(s.upiId)+'"><input id="sn" placeholder="Payee name" value="'+esc(s.upiName)+'"><label>QR code image players scan</label>'+(s.qrImage?'<img class="pv" style="height:150px" src="'+esc(s.qrImage)+'">':'<p class="mu">No QR set.</p>')+'<input type="file" id="qf" accept="image/*"><button class="b x sm" id="q0">Remove custom QR (use bundled)</button></div>'+
'<div class="card"><b>🎧 Helpline (Menu › Contact Us)</b><label>WhatsApp number (with country code)</label><input id="wa" value="'+esc(s.whatsapp)+'"><label>Telegram link</label><input id="tg" placeholder="https://t.me/yourchannel" value="'+esc(s.telegramUrl)+'"><label>Instagram link</label><input id="ig" placeholder="https://instagram.com/yourpage" value="'+esc(s.instagramUrl)+'"></div>'+
'<div class="card"><b>⚙️ Numbers</b><div class="g4"><div><label>Minimum withdrawal</label><input id="mw" type="number" value="'+s.minWithdraw+'"></div><div><label>Show room (min before start)</label><input id="rm" type="number" value="'+s.roomMins+'"></div><div><label>Referral reward (coins)</label><input id="rr" type="number" value="'+s.referralReward+'"></div><div><label>Referral: min first deposit</label><input id="rd" type="number" value="'+s.referralMinDeposit+'"></div></div></div><button class="b" id="sv">Save settings</button>'+
'<div class="card" style="margin-top:12px"><b>🖼 Game thumbnails</b><p class="mu">Photos for Home tiles (and matches without their own banner). JPG/PNG/WEBP up to 20 MB.</p>'+(s.categories||[]).map(function(c){return'<div class="g2" style="align-items:center;margin-top:8px"><div><b>'+esc(c.name)+'</b>'+(ci[c.id]?'<img class="pv" src="'+esc(ci[c.id])+'">':'')+'</div><div><input type="file" accept="image/*" data-cf="'+c.id+'">'+(ci[c.id]?'<button class="b r sm" data-cr="'+c.id+'">Remove</button>':'')+'</div></div>'}).join('')+'</div>'+
'<div class="card"><b>📄 Menu pages (FAQ, About, Privacy, Terms)</b>'+[['faq','FAQ'],['about','About Us'],['privacy','Privacy Policy'],['terms','Terms & Conditions']].map(function(p){return'<label>'+p[1]+'</label><textarea id="pg_'+p[0]+'" rows="5">'+esc(pg[p[0]])+'</textarea>'}).join('')+'<button class="b" id="sp">Save pages</button></div>';
$('qf').onchange=function(){up(this.files[0],function(u){act('PUT','/api/admin/settings',{qrImage:u},function(){toast('QR updated');pSet(v)})})};$('q0').onclick=function(){act('PUT','/api/admin/settings',{qrImage:''},function(){pSet(v)})};
each('[data-cf]',v,function(i){i.onchange=function(){var id=i.dataset.cf;up(i.files[0],function(u){var o={};o[id]=u;act('PUT','/api/admin/settings',{catImages:o},function(){toast('Thumbnail updated');pSet(v)})})}});
each('[data-cr]',v,function(b){b.onclick=function(){var o={};o[b.dataset.cr]='';act('PUT','/api/admin/settings',{catImages:o},function(){pSet(v)})}});
$('sv').onclick=function(){act('PUT','/api/admin/settings',{upiId:$('su').value,upiName:$('sn').value,whatsapp:$('wa').value,telegramUrl:$('tg').value,instagramUrl:$('ig').value,minWithdraw:+$('mw').value,roomMins:+$('rm').value,referralReward:+$('rr').value,referralMinDeposit:+$('rd').value},function(){toast('Saved');pSet(v)})};
$('sp').onclick=function(){act('PUT','/api/admin/pages',{faq:$('pg_faq').value,about:$('pg_about').value,privacy:$('pg_privacy').value,terms:$('pg_terms').value},function(){toast('Pages saved')})}})}
function pLog(v){api('GET','/api/admin/logs').then(function(r){v.innerHTML='<div class="card"><table>'+r.rows.map(function(l){return'<tr><td>'+fd(l.created_at)+'</td><td>'+esc(l.email||'-')+'</td><td>'+esc(l.action)+'</td><td>'+esc(l.detail||'')+'</td></tr>'}).join('')+'</table></div>'})}
boot();
</script></body></html>
